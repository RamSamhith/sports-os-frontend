<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SportsOS — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B1020;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .container { max-width: 400px; }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #22d3ee, #0ea5e9);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon::after {
      content: '';
      width: 24px;
      height: 24px;
      background: #0c1a2c;
      border-radius: 50%;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
    p { opacity: 0.7; margin-bottom: 24px; line-height: 1.5; }
    button {
      background: #3B82F6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #2563EB; }
    button:active { transform: scale(0.98); }
    @media (prefers-color-scheme: light) {
      body { background: #FAFAFA; color: #111827; }
      button { background: #2563EB; }
      button:hover { background: #1D4ED8; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" aria-hidden="true"></div>
    <h1>You're offline</h1>
    <p>SportsOS needs an internet connection to load this page. Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
