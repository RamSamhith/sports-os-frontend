<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="#f1f5f9">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1410"/>
      <stop offset="55%" stop-color="#0a1410" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#040a07"/>
    </linearGradient>
    
  <radialGradient id="spot" cx="50%" cy="38%" r="60%">
    <stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
  </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <rect width="1200" height="750" fill="url(#spot)"/>
  
  <ellipse cx="600" cy="640" rx="900" ry="80" fill="#0a3a5a"/>
  <ellipse cx="600" cy="640" rx="120" ry="20" fill="none" stroke="#f1f5f9" stroke-width="2" opacity="0.5"/>
  <g transform="translate(600 640)">
    <circle r="60" fill="#0f172a" stroke="#f1f5f9" stroke-width="3"/>
    <g transform="translate(0 -60)">
      <circle r="14" fill="#86efac"/>
      <line x1="0" y1="14" x2="0" y2="40" stroke="#f1f5f9" stroke-width="8"/>
    </g>
  </g>
  <g transform="translate(380 540)">
    <ellipse rx="14" ry="6" fill="#0f172a" stroke="#86efac" stroke-width="2"/>
    <ellipse cx="0" cy="-4" rx="14" ry="4" fill="#86efac"/>
  </g>

  
  <g transform="translate(40 700)">
    <rect x="-8" y="-26" width="780" height="48" rx="8" fill="#000" opacity="0.55"/>
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">#f1f5f9</text>
    <text x="0" y="22" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#cbd5e1">#86efac</text>
  </g>
